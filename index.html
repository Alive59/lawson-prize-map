<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Layout: one-screen tool. Sidebar (search, ward filter, store list) beside a street basemap; stacks map-over-list on phones. */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#16202c; --muted:#5d6b7c; --line:#dbe1e8;
  --accent:#0b5fae; --accent-soft:#e3eefa; --pin:#0b5fae; --pin-hi:#e8501f;
  --font-body:"Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-weight:800;font-size:19px;margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.meta{color:var(--muted);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
main{flex:1;min-height:0;display:grid;grid-template-columns:360px 1fr}
aside{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--panel)}
.controls{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.controls label{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center}
.count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:12.5px}
button:hover{border-color:var(--accent);color:var(--accent)}
#list{flex:1;overflow-y:auto;min-height:0}
.group{position:sticky;top:0;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;padding:5px 16px;display:flex;justify-content:space-between;z-index:1}
.item{display:block;padding:9px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover{background:var(--bg)}
.item.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--pin-hi)}
.item .n{font-weight:600}
.item .a{color:var(--muted);font-size:12.5px}
.empty{padding:24px 16px;color:var(--muted)}
#map{min-height:0;height:100%}
.leaflet-popup-content{font-family:var(--font-body);margin:12px 14px}
.pop h2{font-size:15px;margin:0 0 4px}
.pop p{margin:2px 0;color:var(--muted);font-size:12.5px}
.pop a{color:var(--accent);font-weight:600}
.pop .approx{font-size:11.5px}
@media (max-width:760px){
  main{grid-template-columns:1fr;grid-template-rows:52% 48%}
  #map{grid-row:1;border-bottom:1px solid var(--line)}
  aside{grid-row:2;border-right:0}
  header{padding:10px 16px}
}
</style>
</head>

  </aside>

</main>

0052,35.7505],[139.0057,35.7481],[139.0104,35.7423],[139.0123,35.7387],[139.0146,35.7386],[139.0175,35.7396],[139.0217,35.7401],[139.0271,35.7424],[139.0279,35.7443],[139.032,35.7442],[139.0345,35.7425],[139.0399,35.7445],[139.0414,35.7461],[139.0411,35.7478],[139.0397,35.7501],[139.0401,35.7514],[139.0427,35.7551],[139.0431,35.7577],[139.0458,35.758],[139.0492,35.7601],[139.0532,35.7596],[139.0549,35.7602],[139.0569,35.7637],[139.0583,35.7644],[139.0609,35.7641],[139.0636,35.7656],[139.0665,35.7656],[139.069,35.7669],[139.0706,35.7685],[139.0736,35.77],[139.075,35.772],[139.0801,35.7701],[139.0829,35.7699],[139.0868,35.7712],[139.0885,35.7702],[139.0934,35.77],[139.0954,35.7727],[139.0954,35.7747],[139.0966,35.7759],[139.1012,35.7776],[139.1022,35.7784],[139.1059,35.7791],[139.1075,35.7768],[139.1097,35.7755],[139.1143,35.7735],[139.115,35.7726],[139.1182,35.7714],[139.1212,35.7696],[139.123,35.7694],[139.1251,35.7676],[139.1282,35.767],[139.1308,35.7651],[139.1328,35.7664],[139.1361,35.7703],[139.1376,35.7724],[139.1372,35.778],[139.1405,35.779],[139.1428,35.781],[139.1478,35.782],[139.1469,35.7851],[139.1476,35.789],[139.1476,35.7916],[139.1469,35.793],[139.1487,35.7945],[139.1498,35.7964],[139.1546,35.7977],[139.1563,35.7986],[139.1583,35.7983],[139.1609,35.7992],[139.1648,35.8016],[139.1673,35.8017],[139.1715,35.8036],[139.1717,35.8051],[139.1736,35.8068],[139.1755,35.8068],[139.1742,35.8128],[139.1774,35.8202],[139.1752,35.8268],[139.1784,35.8306],[139.1769,35.8331],[139.1774,35.8351],[139.1753,35.8361],[139.1717,35.84],[139.1711,35.84],[139.1661,35.843],[139.1664,35.8446],[139.1647,35.8473],[139.1626,35.8496],[139.1635,35.8509]]]]}},{"type":"Feature","properties":{"name":"所属未定地"},"geometry":{"type":"MultiPolygon","coordinates":[[[[139.841,35.6431],[139.8494,35.6428],[139.8504,35.6565],[139.8455,35.6567],[139.843,35.6568],[139.8425,35.6534],[139.8417,35.6507],[139.841,35.6431]]],[[[139.8069,35.5977],[139.8056,35.5962],[139.8117,35.5886],[139.8058,35.5854],[139.8085,35.5839],[139.8134,35.5787],[139.8322,35.5889],[139.8321,35.5892],[139.8215,35.6056],[139.8195,35.6046],[139.8206,35.603],[139.8152,35.6001],[139.817,35.5979],[139.8119,35.5951],[139.8089,35.5988],[139.8079,35.5982],[139.8111,35.5943],[139.8102,35.5938],[139.8103,35.5943],[139.8069,35.5977]]]]}}]};
const S = STORES.map((s,i)=>({id:i,name:s[0],zip:s[1],addr:s[2],muni:s[3],ro:s[4],lat:s[5],lng:s[6]}));
const byMuni = new Map(); S.forEach(s=>byMuni.set(s.muni,(byMuni.get(s.muni)||0)+1));
const roOf = Object.fromEntries(S.map(s=>[s.muni,s.ro]));
document.getElementById('total').textContent = S.length;
document.getElementById('nmuni').textContent = byMuni.size;

const munis=[...byMuni.entries()].sort((a,b)=>(a[0].endsWith('市')-b[0].endsWith('市'))||b[1]-a[1]);
const opt=m=>`<option value="${m[0]}">${roOf[m[0]]} ${m[0]} (${m[1]})</option>`;
const sel=document.getElementById('ward');
sel.innerHTML=`<option value="">All of Tokyo (${S.length})</option><optgroup label="23 wards">${munis.filter(m=>m[0].endsWith('区')).map(opt).join('')}</optgroup><optgroup label="Tama cities">${munis.filter(m=>!m[0].endsWith('区')).map(opt).join('')}</optgroup>`;

// ---- map ----
const gsiAttr='<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>';
const pale=L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{attribution:gsiAttr,maxNativeZoom:18,maxZoom:19});
const std =L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',{attribution:gsiAttr,maxNativeZoom:18,maxZoom:19});
const osm =L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors',maxZoom:19});
const photo=L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',{attribution:gsiAttr,maxNativeZoom:18,maxZoom:19});
const map=L.map('map',{layers:[osm],zoomControl:true,preferCanvas:false}).setView([35.69,139.6],11);
const wards=L.geoJSON(SHAPES,{style:f=>({color:'#0b5fae',weight:1.2,opacity:.55,fill:false,interactive:false})}).addTo(map);
L.control.layers({'OpenStreetMap':osm,'GSI standard (標準地図)':std,'GSI pale (淡色地図)':pale,'Aerial photo (写真)':photo},{'Ward / city borders':wards},{collapsed:true}).addTo(map);
L.control.scale({imperial:false}).addTo(map);
const tokyoBounds=L.latLngBounds(S.map(s=>[s.lat,s.lng])).pad(0.05);
map.fitBounds(tokyoBounds);

const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function popup(s){
  const q=encodeURIComponent('ローソン 東京都'+s.addr);
  return `<div class="pop"><h2>ローソン ${esc(s.name)}店</h2><p>〒${s.zip} 東京都${esc(s.addr)}</p><p>${s.ro} ${s.muni}</p><p><a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Open in Google Maps</a></p><p class="approx">Pin is at the 丁目 centre. The store is within a few hundred metres.</p></div>`;
}
const baseStyle={radius:7,color:'#fff',weight:2,fillColor:'#0b5fae',fillOpacity:.95};
const hiStyle={radius:10,color:'#fff',weight:2.5,fillColor:'#e8501f',fillOpacity:1};
S.forEach(s=>{
  s.m=L.circleMarker([s.lat,s.lng],baseStyle).bindPopup(popup(s),{maxWidth:300}).bindTooltip(s.name,{direction:'top',offset:[0,-6]});
  s.m.on('click',()=>pick(s,false));
  s.m.on('popupclose',()=>{ if(cur===s.id) unpick(); });
});
const layer=L.featureGroup().addTo(map);

// ---- list + filter ----
const q=document.getElementById('q'), list=document.getElementById('list'), cnt=document.getElementById('count');
let cur=-1, shown=S;
const norm=t=>t.normalize('NFKC').toLowerCase().replace(/[‐−–ー-]/g,'-');
S.forEach(s=>s.key=norm(s.name+' '+s.addr+' '+s.zip+' '+s.ro+' '+s.muni));
function apply(fit){
  const t=norm(q.value.trim()), m=sel.value;
  shown=S.filter(s=>(!m||s.muni===m)&&(!t||t.split(/\s+/).every(w=>s.key.includes(w))));
  layer.clearLayers(); shown.forEach(s=>layer.addLayer(s.m));
  wards.setStyle(f=>({color:'#0b5fae',weight:f.properties.name===m?3:1.2,opacity:f.properties.name===m?.9:.55,fill:false}));
  cnt.textContent = shown.length===S.length?`Showing all ${S.length} stores`:`${shown.length} of ${S.length} stores match`;
  const groups=new Map(); shown.forEach(s=>{ if(!groups.has(s.muni)) groups.set(s.muni,[]); groups.get(s.muni).push(s); });
  list.innerHTML = groups.size ? [...groups].map(([mu,arr])=>
    `<div class="group"><span>${arr[0].ro} ${mu}</span><span>${arr.length}</span></div>`+
    arr.map(s=>`<div class="item${s.id===cur?' on':''}" role="listitem" tabindex="0" data-id="${s.id}"><div class="n">${esc(s.name)}</div><div class="a">〒${s.zip} ${esc(s.addr)}</div></div>`).join('')
  ).join('') : `<div class="empty">No stores match “${esc(q.value)}”. Try a shorter word or pick All of Tokyo.</div>`;
  if(fit){
    if(m){ const f=wards.getLayers().find(l=>l.feature.properties.name===m); if(f) map.fitBounds(f.getBounds(),{padding:[20,20]}); }
    else if(shown.length && shown.length<S.length){ shown.length===1 ? map.setView([shown[0].lat,shown[0].lng],16) : map.fitBounds(layer.getBounds(),{padding:[40,40],maxZoom:16}); }
    else map.fitBounds(tokyoBounds);
  }
}
let timer; q.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>apply(true),250);});
sel.addEventListener('change',()=>apply(true));
document.getElementById('reset').onclick=()=>{q.value='';sel.value='';map.closePopup();apply(true);};
const go=e=>{const it=e.target.closest('.item'); if(it) pick(S[+it.dataset.id],true);};
list.addEventListener('click',go);
list.addEventListener('keydown',e=>{if(e.key==='Enter') go(e);});

function pick(s,fromList){
  if(cur>=0) S[cur].m.setStyle(baseStyle);
  cur=s.id; s.m.setStyle(hiStyle).bringToFront();
  document.querySelectorAll('.item.on').forEach(x=>x.classList.remove('on'));
  const el=list.querySelector(`.item[data-id="${s.id}"]`);
  if(el){ el.classList.add('on'); if(!fromList) el.scrollIntoView({block:'nearest'}); }
  if(fromList){ map.setView([s.lat,s.lng],Math.max(map.getZoom(),16)); s.m.openPopup(); }
}
function unpick(){
  if(cur>=0) S[cur].m.setStyle(baseStyle);
  cur=-1; document.querySelectorAll('.item.on').forEach(x=>x.classList.remove('on'));
}
apply(false);
</script>
