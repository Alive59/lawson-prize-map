<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ライフ Supermarket Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Layout: one-screen tool. Sidebar (search, filters, floor legend, list) beside a street map; stacks map-over-list on phones. */
:root{
  --bg:#f4f6f3; --panel:#ffffff; --ink:#18221c; --muted:#5b6a60; --line:#dce3dd;
  --accent:#1b7a46; --accent-soft:#e4f2ea;
  --one:#2563c9; --multi:#e0531f;
  --font-body:"Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-weight:800;font-size:19px;margin:0}
h1 span{color:var(--accent)}
.meta{color:var(--muted);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
main{flex:1;min-height:0;display:grid;grid-template-columns:370px 1fr}
aside{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--panel)}
.controls{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.controls label.h{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.04em}
input[type=search],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,.item:focus-visible,.chip:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:5px 11px 5px 8px;cursor:pointer;font-size:13px;user-select:none;background:var(--panel)}
.chip input{margin:0;accent-color:var(--accent)}
.chip .dot{width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.chip b{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted)}
.count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:12.5px;white-space:nowrap}
button:hover{border-color:var(--accent);color:var(--accent)}
#list{flex:1;overflow-y:auto;min-height:0}
.group{position:sticky;top:0;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;padding:5px 16px;display:flex;justify-content:space-between;z-index:1}
.item{display:grid;grid-template-columns:12px 1fr;gap:10px;align-items:start;padding:9px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover{background:var(--bg)}
.item.on{background:var(--accent-soft)}
.item .dot{width:12px;height:12px;border-radius:50%;margin-top:4px}
.item .n{font-weight:600}
.item .a{color:var(--muted);font-size:12.5px}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
.tag.one{background:#e3ecfb;color:var(--one)}
.tag.multi{background:#fde8df;color:#b23c0f}
.empty{padding:24px 16px;color:var(--muted)}
#map{min-height:0;height:100%}
.leaflet-popup-content{font-family:var(--font-body);margin:12px 14px;font-size:13px}
.pop h2{font-size:15px;margin:0 0 4px}
.pop p{margin:2px 0;color:var(--muted)}
.pop .floors{margin:6px 0;color:var(--ink)}
.pop pre{font:inherit;white-space:pre-wrap;margin:4px 0 0;color:var(--muted);font-size:12px;background:var(--bg);border-radius:6px;padding:5px 7px}
.pop .links{display:flex;gap:12px;margin-top:6px}
.pop a{color:var(--accent);font-weight:600}
.legend{background:var(--panel);border-radius:8px;padding:8px 10px;box-shadow:0 1px 6px rgba(0,0,0,.2);font-size:12px;line-height:1.7}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
@media (max-width:760px){
  main{grid-template-columns:1fr;grid-template-rows:52% 48%}
  #map{grid-row:1;border-bottom:1px solid var(--line)}
  aside{grid-row:2;border-right:0}
  header{padding:10px 16px}
}
</style>
</head>
<body>
<header>
  <h1><span>ライフ</span> supermarket map</h1>
  <div class="meta">
    <span><b id="total">0</b> stores</span>
    <span><b id="nmulti">0</b> multi-floor</span>
    <span>Data from store.lifecorp.jp, read 8 Nov 2026</span>
  </div>
</header>
<main>
  <aside>
    <div class="controls">
      <label class="h" for="q">Search name or address</label>
      <input id="q" type="search" placeholder="e.g. 新宿, 駅前, 阿倍野" autocomplete="off">
      <div class="row">
        <select id="pref" aria-label="Prefecture"></select>
        <select id="brand" aria-label="Store brand"></select>
        <button id="reset" type="button">Reset</button>
      </div>
      <span class="h" style="font-size:11.5px;font-weight:600;color:var(--muted)">Sales floors</span>
      <div class="chips">
        <label class="chip"><input type="checkbox" id="f-one" checked><span class="dot" style="background:var(--one)"></span>One floor <b id="c-one"></b></label>
        <label class="chip"><input type="checkbox" id="f-multi" checked><span class="dot" style="background:var(--multi)"></span>Multiple floors <b id="c-multi"></b></label>
      </div>
      <div class="count" id="count"></div>
    </div>
    <div id="list" role="list"></div>
  </aside>
  <div id="map" aria-label="Street map with ライフ store locations"></div>
</main>

}
S.forEach(s=>{
  s.mk=L.circleMarker([s.lat,s.lng],style(s,false)).bindPopup(popup(s),{maxWidth:320}).bindTooltip(s.n,{direction:'top',offset:[0,-6]});
  s.mk.on('click',()=>pick(s,false));
  s.mk.on('popupclose',()=>{ if(cur===s.id) unpick(); });
});
const layer=L.featureGroup().addTo(map);

// ---- filters + list ----
const q=document.getElementById('q'), list=document.getElementById('list'), countEl=document.getElementById('count');
const fOne=document.getElementById('f-one'), fMulti=document.getElementById('f-multi');
let cur=-1, shown=S;
const norm=t=>t.normalize('NFKC').toLowerCase();
S.forEach(s=>s.key=norm([s.n,s.a,s.z,s.b,s.p].join(' ')));
function apply(fit){
  const t=norm(q.value.trim()), p=prefSel.value, b=brandSel.value;
  const base=S.filter(s=>(!p||s.p===p)&&(!b||s.b===b)&&(!t||t.split(/\s+/).every(w=>s.key.includes(w))));
  document.getElementById('c-one').textContent=base.filter(s=>!s.m).length;
  document.getElementById('c-multi').textContent=base.filter(s=>s.m).length;
  shown=base.filter(s=>s.m?fMulti.checked:fOne.checked);
  layer.clearLayers(); shown.forEach(s=>layer.addLayer(s.mk));
  shown.filter(s=>s.m).forEach(s=>s.mk.bringToFront());
  countEl.textContent=shown.length===S.length?`Showing all ${S.length} stores`:`${shown.length} of ${S.length} stores shown`;
  const groups=new Map();
  [...shown].sort((a,b)=>(PREF_ORDER.indexOf(a.p)-PREF_ORDER.indexOf(b.p))||a.a.localeCompare(b.a,'ja')).forEach(s=>{ if(!groups.has(s.p)) groups.set(s.p,[]); groups.get(s.p).push(s); });
  list.innerHTML=groups.size?[...groups].map(([pf,arr])=>
    `<div class="group"><span>${pf}</span><span>${arr.length}</span></div>`+
    arr.map(s=>`<div class="item${s.id===cur?' on':''}" role="listitem" tabindex="0" data-id="${s.id}"><span class="dot" style="background:${s.m?MULTI:ONE}"></span><div><div class="n">${esc(s.n)}<span class="tag ${s.m?'multi':'one'}">${s.m?'Multi':'1F'}</span></div><div class="a">${esc(s.a)}</div></div></div>`).join('')
  ).join(''):`<div class="empty">No stores match. Try a shorter word, or turn both floor types back on.</div>`;
  if(fit){
    if(shown.length===1) map.setView([shown[0].lat,shown[0].lng],17);
    else if(shown.length) map.fitBounds(layer.getBounds(),{padding:[30,30],maxZoom:16});
  }
}
let timer; q.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>apply(true),250);});
[prefSel,brandSel].forEach(el=>el.addEventListener('change',()=>apply(true)));
[fOne,fMulti].forEach(el=>el.addEventListener('change',()=>apply(false)));
document.getElementById('reset').onclick=()=>{q.value='';prefSel.value='';brandSel.value='';fOne.checked=fMulti.checked=true;map.closePopup();apply(true);};
const go=e=>{const it=e.target.closest('.item'); if(it) pick(S[+it.dataset.id],true);};
list.addEventListener('click',go);
list.addEventListener('keydown',e=>{if(e.key==='Enter') go(e);});
function pick(s,fromList){
  if(cur>=0) S[cur].mk.setStyle(style(S[cur],false));
  cur=s.id; s.mk.setStyle(style(s,true)).bringToFront();
  document.querySelectorAll('.item.on').forEach(x=>x.classList.remove('on'));
  const el=list.querySelector(`.item[data-id="${s.id}"]`);
  if(el){ el.classList.add('on'); if(!fromList) el.scrollIntoView({block:'nearest'}); }
  if(fromList){ map.setView([s.lat,s.lng],Math.max(map.getZoom(),17)); s.mk.openPopup(); }
}
function unpick(){ if(cur>=0) S[cur].mk.setStyle(style(S[cur],false)); cur=-1; document.querySelectorAll('.item.on').forEach(x=>x.classList.remove('on')); }
apply(false);
</script>
</body>
</html>
